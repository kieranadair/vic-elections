[theme]
base = "light"
primaryColor = "#263746"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F8"
textColor = "#26313B"
linkColor = "#42657F"
borderColor = "#E4E8EB"
font = "sans-serif"
baseFontSize = 15
headingFontSizes = ["40px", "28px", "21px", "18px", "16px", "14px"]
headingFontWeights = [600, 500, 500, 500, 500, 500]
paddingTop = "1.25rem"
paddingBottom = "2rem"
baseRadius = "6px"
showWidgetBorder = true

[server]
headless = true

[browser]
gatherUsageStats = false
